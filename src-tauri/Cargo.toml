[package]
name = "jianji"
version = "0.1.0"
description = "简记 - 本地优先的笔记与清单"
authors = ["ledon"]
edition = "2021"

[lib]
name = "jianji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
