name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: notes-app/src-tauri -> target

      - name: Install frontend deps
        working-directory: notes-app
        run: npm ci

      - name: Build app
        working-directory: notes-app
        run: npm run app:build -- ${{ matrix.args }}

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jianji-${{ matrix.args != '' && 'intel' || 'apple-silicon' }}
          path: |
            notes-app/src-tauri/target/*/release/bundle/dmg/*.dmg
            notes-app/src-tauri/target/*/release/bundle/macos/*.app

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jianji-windows
          path: |
            notes-app/src-tauri/target/release/bundle/nsis/*.exe
            notes-app/src-tauri/target/release/bundle/msi/*.msi
